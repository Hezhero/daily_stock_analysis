[flake8]
max-line-length = 120
exclude = 
    .git,
    __pycache__,
    .env,
    venv,
    .venv,
    .venv*,
    build,
    dist,
    local,
    node_modules,
    */node_modules/*,
    *.egg-info
# E501: 行太长（有些地方确实需要长行）
# W503: 运算符在换行前（与 black 冲突）
# E203: 切片前的空格（与 black 冲突）
# E402: 模块级导入不在文件顶部（有时需要先设置环境变量）
ignore = E501,W503,E203,E402

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
# ``--timeout=120`` hard-fails a single test that runs longer than two minutes
# (issue #2131: backend-gate hung indefinitely around AlphaSift hotspot cases
# without a traceback). ``timeout_method=thread`` stays reliable when a test has
# swallowed Ctrl-C / signal handling; ``faulthandler_timeout=300`` dumps all
# thread stacks after five minutes of silence for a post-mortem.
addopts = -v --tb=short --timeout=120 -o timeout_method=thread -o faulthandler_timeout=300
norecursedirs =
    .git
    __pycache__
    .env
    venv
    .venv
    .venv*
    build
    dist
    local
    node_modules
    */node_modules/*
markers =
    unit: fast offline unit tests
    integration: service-level integration tests without external network dependency
    network: tests requiring external network or third-party services

[isort]
profile = black
line_length = 120
skip = .git,__pycache__,.env,venv,.venv,local,node_modules
skip_glob = */node_modules/*
known_first_party = config,storage,analyzer,notification,scheduler,search_service,market_analyzer,stock_analyzer,data_provider
